[project]
name = "backend"
version = "0.1.0"
description = "Local LLM chatbot using FastAPI and Ollama"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "httpx",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-name = "backend"
module-root = "src"

[tool.fastapi]
entrypoint = "backend.main:app"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # Import sorting
    "UP",   # Modern Python syntax
    "B",    # Bugbear
]